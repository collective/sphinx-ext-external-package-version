[tox]
envlist =
    py312
    py312-sphinx-version-smoke
    py313
    py314
    py315
    linkcheck

[testenv]
description = test environment
runner = uv-venv-lock-runner
dependency_groups = dev
setenv =
    py312: WHEEL_SMOKE=1
commands =
    # test html output
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html
    pytest

[testenv:linkcheck]
description = linkcheck
base_python = py315
commands =
    # check links
    sphinx-build -W -b linkcheck -d {envtmpdir}/doctrees docs {envtmpdir}/linkcheck

[testenv:py310-sphinx-version-smoke]
description = minimal Sphinx 9.1.0 compatibility smoke test
base_python = py312
dependency_groups =
deps =
    sphinx==9.1.0
commands =
    python tests/smoke.py
